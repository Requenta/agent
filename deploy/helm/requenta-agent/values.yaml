image:
  repository: requenta-agent
  digest: ""
  tag: local
  pullPolicy: IfNotPresent
# Only for an image built and loaded into a disposable local cluster.
development: false
nodes:
  selector: requenta.com/pool=true
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
networkPolicy:
  enabled: true
  # Required: the API service IP and/or actual endpoint CIDR used by your CNI.
  apiServerCIDRs: []
  apiServerPort: 443

connection:
  origin: ""
  existingSecret: ""

# Explicit activation only after offer qualification. Inventory privileges are unchanged.
execution:
  # Requires an approved workspace image with agent/workspace/sshd_config.
  sshEnabled: false
  enabled: false
  image:
    repository: requenta-execution
    digest: ""
    tag: local
  existingSecret: ""
  workspaceImage: ""
  clusterReference: ""
  allowedNodes: []
  # A verified node filesystem and kubelet local-storage accounting are required.
  resourcesV2: true
  maxScratchGiB: 2000
  # Aggregate reservation budget, including 10 GiB runtime overhead per booking.
  maxEphemeralStorageGiB: 16160
  maxGpus: 8
  maxLifetimeSeconds: 14400
  # Must include the actual API endpoint IP/port as enforced by the supplier CNI.
  apiServerCIDRs: []
  apiServerPort: 443
  controlPlaneCIDRs: []
